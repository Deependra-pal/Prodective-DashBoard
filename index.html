          <h2>Productivity Dashboard</h2>
          <div class="icon">
            <img src="" alt="" />
          </div>
        </div>
      </nav>

        <div class="all-feature">
          <div class="todo elem" id="0">
            <h2>TO DO List</h2>
            <img
              src="https://plus.unsplash.com/premium_photo-1710962184909-f9f8dc2c9f5f?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8OXx8M0R8ZW58MHx8MHx8fDA%3D"
            />
          </div>

          <div class="daily elem" id="1">
            <h2>Daily Planner</h2>
            <img
              src="https://images.unsplash.com/photo-1644310885721-98c5c7f94ca3?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8NTR8fDNEfGVufDB8fDB8fHww"
            />
          </div>

          <div class="moti elem" id="2">
            <h2>Motivation</h2>
            <img
              src="https://images.unsplash.com/photo-1634025151266-4773d6189169?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mjh8fDNEfGVufDB8fDB8fHww"
            />
          </div>

          <div class="pomo elem" id="3">
            <h2>Pomodoro Timer</h2>
            <img
              src="https://images.unsplash.com/photo-1648457257285-cfbc3781cc54?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8M3x8M0R8ZW58MHx8MHx8fDA%3D"
            />
          </div>

          <div class="goals elem" id="4">
            <h2>Daily Goals</h2>
            <img
              src="https://images.unsplash.com/photo-1677249490921-3246e81f19e3?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTl8fDNEfGVufDB8fDB8fHww"
            />
          </div>
        </div>
      </section>

      <div class="fullPage todo-fullpage" id="0">
        <button class="backbtn" id="0">Back</button>
        <h2 class="heading">📋 Your Tasks</h2>

        <div class="todo-container">
          <div class="add-Task">
            <form>
              <h3>Add Task</h3>
              <input type="text" placeholder="Enter Task" />
              <textarea
                name=""
                id="text"
                placeholder="Enter Details"
              ></textarea>
              <div class="mark-imp">
                <input class="box" type="checkbox" name="checked" id="check" />
                <label for="check">Mark as imp</label>
              </div>
              <button class="button">Add Task</button>
            </form>
          </div>

          <div class="all-Task">
            <h3>Your All Task</h3>
          </div>
        </div>
      </div>

      <div class="fullPage daily-Planner" id="1">
        <button class="backbtn" id="1">Back</button>
        <div class="date">
          <h2>Daily Planner</h2>
          <h3></h3>
        </div>

        <div class="task"></div>

        <div class="planner"></div>
      </div>

      <div class="fullPage motivation-page" id="2">
        <button class="backbtn" id="2">Back</button>
        <div class="motivation-container">
          <div class="motivation-wrapper">
            <div class="motivation-1">
              <h2>Quote of the day</h2>
              <div class="date">
                <h5></h5>
                <h3></h3>
              </div>
            </div>
            <div class="motivation-2">
              <h2></h2>
            </div>
            <div class="author-name">
              <h2></h2>
            </div>
          </div>
        </div>
      </div>

      <div class="fullPage pomodoro-full-page" id="3">
        <button class="backbtn" id="3">Back</button>
        <h1>Study with me!</h1>
         
        <div class="pomo-timer">
          <h4>Work Secssion</h4>
           <h2>25:00</h2>
             <div>
              <button class="start-timer">Start</button>
            <button class="pause-timer">Restart</button>
            <button class="restart-timer">Rest</button>
             </div>
        </div>
      </div>

      <div class="fullPage" id="4">
        <button class="backbtn" id="4">Back</button>
        <h1>Daily Goals</h1>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
